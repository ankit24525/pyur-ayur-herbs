name: Auto Deploy to AlphaVPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/pyur-ayur-herbs
            git reset --hard origin/main
            git pull origin main
            npm install
            npm run build
            pm2 reload ayur-herb
